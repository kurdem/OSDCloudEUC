name: Validate PowerShell

on:
  push:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/validate-powershell.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
  workflow_dispatch:

jobs:
  analyze:
    name: PSScriptAnalyzer + Parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Parse all scripts (Syntaxpruefung)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = Get-ChildItem -Path src, scripts, tests -Recurse -Include *.ps1, *.psm1
          $hadError = $false
          foreach ($f in $files) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors) {
              $hadError = $true
              Write-Host "::error file=$($f.FullName)::Parse-Fehler"
              $errors | ForEach-Object { Write-Host "  $($_.Message) (Zeile $($_.Extent.StartLineNumber))" }
            }
          }
          if ($hadError) { throw 'Parse-Fehler gefunden.' }
          Write-Host "Alle $($files.Count) Dateien fehlerfrei geparst."

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path src, scripts, tests -Recurse -Severity Error, Warning -ExcludeRule PSAvoidUsingWriteHost, PSUseShouldProcessForStateChangingFunctions
          $results | Format-Table -AutoSize
          $errors = @($results | Where-Object Severity -eq 'Error')
          if ($errors.Count -gt 0) {
            Write-Host "::error::$($errors.Count) PSScriptAnalyzer-Fehler."
            exit 1
          }

  pester:
    name: Pester Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -MinimumVersion 5.5.0 -Force -Scope CurrentUser

      - name: Run Pester
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 5.5.0
          $config = New-PesterConfiguration
          $config.Run.Path = 'tests'
          $config.Output.Verbosity = 'Detailed'
          $config.Run.Exit = $true
          Invoke-Pester -Configuration $config
